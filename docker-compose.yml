services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      MLECC_STORAGE_ROOT: /storage
    volumes:
      - ./backend:/app
      - ./storage:/storage

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
      VITE_API_ORIGIN: http://127.0.0.1:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
