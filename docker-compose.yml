services:
  backend:
    build:
      context: ./backend
      args:
        SOURCE_REVISION: ${MLECC_SOURCE_REVISION:-untracked}
    ports:
      - "8000:8000"
    environment:
      MLECC_STORAGE_ROOT: /storage
    volumes:
      - ./backend:/app
      - ./storage:/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
      VITE_API_ORIGIN: http://127.0.0.1:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
